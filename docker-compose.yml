services:
  calendar:
    build:
      context: .
      dockerfile: Dockerfile
    image: homecal:latest
    container_name: homecal
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # host:container — change the host port to suit your LAN / reverse proxy.
      - "${HOMECAL_PORT:-8787}:8787"
    volumes:
      # Host bind-mount of the DATA DIRECTORY (not a single file) so the
      # SQLite .db + -wal + -shm all persist and ride the server's backups.
      - ${HOMECAL_DATA_DIR:-./data}:/data
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    environment:
      - PORT=8787
      - HOST=0.0.0.0
      - DATA_DIR=/data
      - STATIC_DIR=/app/frontend/dist
      - NODE_ENV=production
      # Shared secret with the Pi voice service (set in .env). Empty → voice routes 503.
      - PI_API_TOKEN=${PI_API_TOKEN:-}

  kokoro-tts:
    build:
      context: ./kokoro-tts
      dockerfile: Dockerfile
      additional_contexts:
        # Make the catalogs reachable from the kokoro-tts build context without
        # duplicating files in the repo. Docker BuildKit feature.
        catalogs: ./kiosk/voice/homecal_voice/catalogs
    platform: linux/amd64
    restart: unless-stopped
    mem_limit: 1500m
    ports:
      - "8789:8789"
    environment:
      - PI_API_TOKEN=${PI_API_TOKEN:-}
      - KOKORO_MODEL_PATH=/app/models/kokoro-v1.0.fp16.onnx
      - KOKORO_VOICES_PATH=/app/models/voices-v1.0.bin
      - KOKORO_CATALOG_DIR=/app/cache
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8789/healthz || exit 1"]
      interval: 30s
      timeout: 2s
      start_period: 30s
      retries: 3
