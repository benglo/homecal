[project]
name = "homecal-voice"
version = "0.1.0"
# R15 was conservative — pinned <3.13 in case torch wheels were missing on aarch64.
# Trixie ships 3.13 only (no python3.12 apt package), and our silero ONNX path
# avoids torch entirely, so 3.13 is fine and the pin is unnecessary.
requires-python = ">=3.11"
dependencies = [
  # 0.4.0 ships ONNX-only deps (onnxruntime + sklearn + scipy + tqdm).
  # 0.5+ added tflite-runtime which has no Python 3.13 aarch64 wheel — broken on trixie.
  # Feasibility test on this Pi (2026-06-04) ran 0.4.0 at 0.998 confidence; that's the target.
  "openwakeword>=0.4.0,<0.5.0",
  "onnxruntime>=1.18",
  "numpy>=1.26",
  "requests>=2.32",
  "python-dotenv>=1.0",
  "uuid-utils>=0.10",
  # NOTE: silero-vad is installed separately via install script with --no-deps
  # because it incorrectly pulls torch + CUDA toolkit (~900MB) — we only need
  # the bundled silero_vad.onnx file, which works fine through onnxruntime alone.
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-mock>=3.14", "requests-mock>=1.12"]

[project.scripts]
homecal-voice = "homecal_voice.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["homecal_voice*"]

[tool.pytest.ini_options]
testpaths = ["homecal_voice"]
python_files = ["*_test.py"]
